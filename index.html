// ═══════════════════════════════════════════════════════════ water
function proceduralWaterNormals() {                                         // tileable sum-of-sines fallback

  $('bossfill').style.width = (K.hp / K.maxHp * 100) + '%';
}

// ═══════════════════════════════════════════════════════════ game flow, environment mood, input
let state = 'title', timeScale = 1, time = 0, hiQ = true, endedAt = 0, lockedAt = 0, firing = false, dmgFlash = 0, boatKick = 0, postT = 0;
const G = { wave: 0, toSpawn: 0, spawnT: 0, pause: 2 }, ENV = { mood: 0, moodT: 0, glory: 0, gloryT: 0 }, keys = {};
function applyEnv(rdt) {
  ENV.mood += (ENV.moodT - ENV.mood) * Math.min(1, rdt * .7); ENV.glory += (ENV.gloryT - ENV.glory) * Math.min(1, rdt * .6); const m = ENV.mood, g = ENV.glory, u = water.material.uniforms;
  u.waterColor.value.copy(waterBase).lerp(waterDark, m); u.sunColor.value.copy(sunColBase).multiplyScalar((1 - .65 * m) * (1 + .8 * g));
  sun.intensity = SUN_I * (1 - .6 * m) * (1 + .7 * g); hemi.intensity = HEMI_I * (1 - .5 * m); renderer.toneMappingExposure = EXPOSURE * (1 - .25 * m) * (1 + .3 * g);
  scene.fog.color.copy(fogBase).multiplyScalar((1 - .45 * m) * (1 + .2 * g)); bloom.strength = BLOOM * (1 + 1.8 * g); skyU.turbidity.value = lerp(9, 4, g);   // the sun breaks through
}
function damage(n) { if (state !== 'play' || K.phase === 'dying') return; P.hp = Math.max(0, P.hp - n); dmgFlash = 1; P.shake = Math.max(P.shake, .55); sfx.thud(); if (P.hp <= 0) endGame('dead'); }
function endGame(result) {
  state = result; endedAt = performance.now(); firing = false; document.body.classList.remove('play'); if (document.exitPointerLock) document.exitPointerLock();
  $('sh2').textContent = result === 'won' ? 'The channel is quiet' : 'Lost at sea'; $('sh1').textContent = result === 'won' ? 'Skärgård secured.' : 'Game over';
  $('sp').textContent = result === 'won' ? 'Click to play again' : 'Click to try again'; $('screen').classList.remove('off');
  if (result === 'dead') { sfx.rumble(0); $('fade').style.opacity = .5; }
}
function startGame() {
  for (const Z of zombies) scene.remove(Z.root); zombies.length = 0; for (const d of debris) boat.remove(d.m); debris.length = 0;
  for (const T of K.tentacles) { T.state = 'hidden'; T.e = T.ww = T.sw = T.lw = 0; T.hits = 0; T.cool = 1e9; hideTentacle(T); } suckers.instanceMatrix.needsUpdate = true;
  K.phase = 'none'; K.hp = K.maxHp; K.head.position.y = -11; K.light.intensity = 0;
  Object.assign(ENV, { moodT: 0, gloryT: 0 }); Object.assign(G, { wave: 0, toSpawn: 0, spawnT: 0, pause: 2 }); Object.assign(P, { x: 0, z: 1.5, yaw: 0, pitch: 0, hp: 100, ammo: 30, recoil: 0, shake: 0 });
  W.reloading = false; gmag.visible = true; gmag.position.y = 0; timeScale = 1; sfx.rumble(0);
  $('boss').style.display = 'none'; $('fade').style.opacity = 0; $('wave').textContent = 'Skärgård · 21:47'; $('screen').classList.add('off'); document.body.classList.add('play'); state = 'play';
}
function updateWaves(dt) {
  if (K.phase !== 'none') return;
  if (G.toSpawn > 0) { G.spawnT -= dt; if (G.spawnT <= 0) { spawnZombie(); G.toSpawn--; G.spawnT = rand(1.3, 2.6); } }
  else if (!zombies.length) { G.pause -= dt; if (G.pause <= 0) { if (G.wave < 2) { G.wave++; G.toSpawn = [4, 7][G.wave - 1]; G.pause = 3.5; $('wave').textContent = 'Wave ' + ['I', 'II'][G.wave - 1]; } else startKraken(); } }
}
function setQuality(hi) {
  hiQ = hi; const pr = hi ? Math.min(devicePixelRatio, 1.5) : Math.min(devicePixelRatio, 1) * .8;
  renderer.setPixelRatio(pr); composer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
  sun.castShadow = hi; bloom.enabled = hi; smaa.enabled = hi; camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  pUni.uScale.value = innerHeight * pr / (2 * Math.tan(degToRad(camera.fov / 2)));
  const q = $('qual'); q.textContent = 'Quality · ' + (hi ? 'High' : 'Low'); q.classList.add('on'); clearTimeout(setQuality.t); setQuality.t = setTimeout(() => q.classList.remove('on'), 1600);
}
setQuality(true); addEventListener('resize', () => setQuality(hiQ));
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'KeyQ') setQuality(!hiQ); if (e.code === 'KeyR') reload(); });
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('mousedown', e => {
  if (e.button !== 0) return; initAudio();
  if (state !== 'play') { if (performance.now() - endedAt < 1200) return; startGame(); renderer.domElement.requestPointerLock?.(); return; }
  if (document.pointerLockElement !== renderer.domElement) renderer.domElement.requestPointerLock?.();
  firing = true;
});
addEventListener('mouseup', () => { firing = false; });
document.addEventListener('pointerlockchange', () => { lockedAt = performance.now(); });
addEventListener('mousemove', e => {
  if (state !== 'play' || document.pointerLockElement !== renderer.domElement || performance.now() - lockedAt < 150) return;   // browsers can report a bogus jump right after locking
  P.yaw -= e.movementX * .0021; P.pitch = clamp(P.pitch - e.movementY * .0021, -1.35, 1.35);
  W.swayX = clamp(W.swayX - e.movementX * .00012, -.03, .03); W.swayY = clamp(W.swayY + e.movementY * .00012, -.03, .03);
});
function updatePlayer(dt, rdt) {
  const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0), moving = state === 'play' && (f || s);
  if (moving) { const sp = 1.9 * dt / Math.hypot(f, s), sy = Math.sin(P.yaw), cy = Math.cos(P.yaw); P.x += (-sy * f + cy * s) * sp; P.z += (-cy * f - sy * s) * sp; P.bobT += dt * 8; }
  P.x = clamp(P.x, -.6, .6); P.z = clamp(P.z, .8, 2.3); P.bobA += ((moving ? 1 : 0) - P.bobA) * Math.min(1, dt * 8);
  P.shake *= Math.exp(-5 * rdt); P.recoil *= Math.exp(-10 * dt); const sh = P.shake;
  rig.position.set(P.x, SOLE, P.z); rig.rotation.y = P.yaw;
  camera.position.set(rand(-1, 1) * sh * .03, 1.66 + Math.sin(P.bobT) * .022 * P.bobA + rand(-1, 1) * sh * .03, 0);
  camera.rotation.set(P.pitch + P.recoil + rand(-1, 1) * sh * .012, rand(-1, 1) * sh * .012, rand(-1, 1) * sh * .016 + Math.sin(P.bobT * .5) * .005 * P.bobA);
}
let hudHp = -1, hudAmmo = -1;
function updateHud(rdt) {
  if (P.hp !== hudHp) $('hpv').textContent = hudHp = P.hp; if (P.ammo !== hudAmmo) $('ammov').textContent = hudAmmo = P.ammo;
  dmgFlash = Math.max(0, dmgFlash - rdt * 1.4); $('dmg').style.opacity = Math.min(1, dmgFlash + (state === 'play' ? Math.max(0, .5 - P.hp / 100) : 0));
}

// ═══════════════════════════════════════════════════════════ main loop
const clock = new THREE.Clock();
function tick(rdt) {
  const dt = rdt * timeScale; time += dt;
  applyEnv(rdt);
  boatKick *= Math.exp(-3 * dt);
  boat.position.y = Math.sin(time * .9) * .05 + Math.sin(time * .53 + 1) * .035;                           // bob + roll with the swell; the camera inherits it
  boat.rotation.set(Math.sin(time * .47 + .5) * .014, 0, Math.sin(time * .62) * .03 + Math.sin(time * 1.31 + 2) * .012 + boatKick);
  updatePlayer(dt, rdt);
  if (state === 'play') { if (firing) fire(); updateWaves(dt); }
  updateWeapon(dt, time); updateDebris(dt);
  if (state !== 'title') { updateZombies(state === 'dead' ? dt * .25 : dt); updateKraken(dt, rdt, time); }
  updateParticles(dt); updateRipples(dt); updateMotes(dt, time); updateGulls(dt, time);
  postT -= dt; if (postT <= 0) { postT = rand(.5, 1.1); const p = jettyPosts[Math.floor(rand(jettyPosts.length))]; if (p) ripple(p.x, p.z, 1.1, 2);
    const a = rand(TAU); ripple(Math.sin(a) * 1.3, Math.cos(a) * 4 - .6, 1.6, 2.4); ripple(0, -9.3, .8, 2); }
  water.material.uniforms.time.value += dt * .55; windTime.value = time; fx.uniforms.uTime.value = time;
  updateHud(rdt);
}
{ // pre-compile every material (hidden tentacles included) against the HDR target so nothing hitches mid-fight
  const vis = K.tentacles.map(T => T.mesh); vis.forEach(m => m.visible = true);
  renderer.setRenderTarget(composer.renderTarget1); renderer.compile(scene, camera); renderer.setRenderTarget(null); vis.forEach(m => m.visible = false); }
function loop() { requestAnimationFrame(loop); const rdt = Math.min(clock.getDelta(), .05); tick(rdt); composer.render(rdt); }
loop();
</script>
